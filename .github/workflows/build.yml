name: Build experimental iOS plugin
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packaging-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate load-command injection on synthetic Mach-O fixtures
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Check actual reason formatter with NSSet and private-field fixtures
        run: python3 tests/reason_diagnostics.py
      - name: Compile arm64 device dylib
        run: |
          mkdir -p dist
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.1 \
            -dynamiclib -fobjc-arc -fblocks -Wall -Wextra -Werror \
            -Wno-unused-parameter -framework Foundation -framework UIKit \
            -install_name '@rpath/QualityLab.dylib' \
            QualityLab.m -o dist/QualityLab.dylib
      - name: Validate binary and sign for injection
        run: |
          file dist/QualityLab.dylib | tee dist/binary-info.txt
          lipo dist/QualityLab.dylib -verify_arch arm64
          otool -L dist/QualityLab.dylib | tee -a dist/binary-info.txt
          codesign --force --sign - dist/QualityLab.dylib
          codesign --verify --strict --verbose=2 dist/QualityLab.dylib
          shasum -a 256 dist/QualityLab.dylib > dist/SHA256SUMS
          cp README.md dist/
          ditto -c -k --keepParent dist QualityLab-experimental.zip
      - uses: actions/upload-artifact@v4
        with:
          name: QualityLab-experimental
          path: |
            dist/*
            QualityLab-experimental.zip
          retention-days: 14
